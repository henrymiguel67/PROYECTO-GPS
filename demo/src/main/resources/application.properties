spring.application.name=GPSTRACK_DEMO

# =========================
# BASE DE DATOS MYSQL
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/gpstrack_demo?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=henry2005!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Ejecutar data.sql después de crear tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# =========================
# SWAGGER / OPENAPI
# =========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# =========================
# SERVIDOR
# =========================
server.port=8080